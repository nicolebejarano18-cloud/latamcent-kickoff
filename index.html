<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LatamCent — Kickoff Call Template</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--dark:#1A1A1A;--gray:#666666;--lgray:#D0D0CC;--bg:#F7FAF9;--white:#FFFFFF;--warn-bg:#FEF3E2;--warn-c:#BA7517;--info-bg:#EAF4FB;--info-c:#185FA5;--lock-bg:#FEF0F0;--lock-c:#A32D2D;--must-bg:#FCEBEB;--must-c:#791F1F;--nice-bg:#E6F1FB;--nice-c:#0C447C}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}
.topbar{background:var(--teal);color:#fff;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar-brand{font-size:13px;font-weight:600;letter-spacing:.12em}
.topbar-right{display:flex;align-items:center;gap:16px;font-size:13px}
.prog-text{color:rgba(255,255,255,.75)}
.prog-bar-wrap{width:120px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.prog-bar-fill{height:100%;background:#fff;border-radius:2px;transition:width .3s}
.container{max-width:820px;margin:0 auto;padding:32px 24px}
.card{background:#fff;border-radius:12px;border:1px solid #E5E5E0;padding:32px;margin-bottom:0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec-tag{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--gray);text-transform:uppercase;margin-bottom:4px}
.sec-title{font-size:24px;font-weight:500;margin-bottom:6px;color:var(--dark)}
.sec-sub{font-size:14px;color:var(--gray);margin-bottom:24px;line-height:1.6}
.callout{padding:12px 16px 12px 18px;margin-bottom:20px;font-size:13px;line-height:1.6;border-radius:4px}
.callout-warn{background:var(--warn-bg);border-left:4px solid var(--warn-c);color:#5A3500}
.callout-info{background:var(--info-bg);border-left:4px solid var(--info-c);color:#0A3A6B}
.callout-lock{background:var(--lock-bg);border-left:4px solid var(--lock-c);color:#5A0E0E}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g1{margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.fg input,.fg textarea{font-size:14px;padding:10px 14px;border:1px solid #DDD;border-radius:8px;background:#FAFAFA;color:var(--dark);font-family:inherit;transition:border-color .15s,box-shadow .15s}
.fg input:focus,.fg textarea:focus{outline:none;border-color:var(--teal-mid);box-shadow:0 0 0 3px rgba(29,158,117,.12)}
.fg textarea{min-height:80px;resize:vertical}
.qblock{margin-bottom:20px;padding:16px;background:#FAFAFA;border-radius:8px;border:1px solid #EEE}
.qnum{font-size:11px;font-weight:700;color:var(--teal-mid);margin-bottom:4px;letter-spacing:.06em}
.qtext{font-size:14px;color:var(--gray);margin-bottom:10px;line-height:1.55}
.chklist{display:flex;flex-direction:column;gap:8px}
.chkitem{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:1px solid #E5E5E0;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.5;transition:all .15s;background:#fff}
.chkitem:hover{background:#F5FBF8;border-color:var(--teal-mid)}
.chkitem input[type=checkbox]{margin-top:2px;width:17px;height:17px;flex-shrink:0;accent-color:var(--teal-mid)}
.chkitem.on{background:#F0FAF6;border-color:var(--teal-mid)}
.icp-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.icp-col{border:1px solid #E5E5E0;border-radius:10px;overflow:hidden}
.icp-hdr{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px}
.icp-must{background:var(--must-bg);color:var(--must-c)}
.icp-nice{background:var(--nice-bg);color:var(--nice-c)}
.icp-col .fg{padding:10px 12px;border-top:1px solid #EEE}
.stage{border:1px solid #E5E5E0;border-left:4px solid var(--teal-mid);border-radius:8px;padding:14px 18px;margin-bottom:10px;background:#fff}
.stage-title{font-size:14px;font-weight:600;margin-bottom:4px}
.stage-sub{font-size:12px;color:var(--gray);margin-bottom:10px;line-height:1.5}
.pcard{border:1px solid #E5E5E0;border-radius:12px;overflow:hidden;margin-bottom:14px}
.pcard-hdr{background:var(--teal-light);padding:12px 18px;font-size:14px;font-weight:600;color:#085041}
.pcard-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:#fff}
.rx-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.rx-btn{padding:6px 16px;border:1px solid #DDD;border-radius:20px;font-size:13px;cursor:pointer;background:#FAFAFA;color:var(--dark);font-family:inherit;transition:all .15s}
.rx-btn:hover{border-color:var(--teal-mid)}
.rx-btn.syes{background:#EAF3DE;border-color:#3B6D11;color:#27500A}
.rx-btn.yes{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.rx-btn.maybe{background:#FAEEDA;border-color:#854F0B;color:#633806}
.rx-btn.no{background:#FCEBEB;border-color:#A32D2D;color:#791F1F}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:24px;border-top:1px solid #EEE}
.navrow-center{font-size:13px;color:var(--gray)}
.btn{padding:10px 22px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #DDD;background:#FAFAFA;color:var(--dark);font-family:inherit;transition:all .15s}
.btn:hover{background:#F0F0F0}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-green{background:var(--teal-mid);border-color:var(--teal);color:#fff}
.btn-green:hover{background:var(--teal)}
.btn-done{background:var(--teal-mid);border-color:var(--teal);color:#fff;padding:12px 32px;font-size:15px;font-weight:600}
.btn-done:hover{background:var(--teal)}
@media(max-width:600px){.g2{grid-template-columns:1fr}.icp-cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">LATAMCENT · KICKOFF TEMPLATE</span>
  <div class="topbar-right">
    <span class="prog-text" id="pLbl">Section 1 of 10</span>
    <div class="prog-bar-wrap"><div class="prog-bar-fill" id="pFill" style="width:10%"></div></div>
  </div>
</div>

<div class="container">
  <div class="card" id="main"></div>
</div>

<script>
const {jsPDF}=window.jspdf;
let cur=0;
const S2=['Reviewed the JD end-to-end — flagged gaps or contradictions','Checked LinkedIn for role tenure, team size, urgency signals','Researched the company: product, business model, growth stage','Noted cultural cues (team composition, remote setup, pace)','Confirmed compensation range with account lead before the call','Prepared 2–3 sample profiles to calibrate ICP on the call','Loaded this template in screen share — client can follow along'];
const S10=['Upload Grain recording and paste URL in Notion client card','Confirm compensation range in writing with account lead','Add completed ICP to Notion','Send client a recap + confirmed profile delivery date','Brief sourcing team with key filters and red flags from this call','Adjust sourcing criteria based on any profile feedback from the call'];
const D={s1:{clientName:'',role:'',datetime:'',tp:'',contacts:'',acctLead:'',type:'',grain:''},s2:{chk:{}},s3:{q1:'',q2:'',q3:'',q4:''},s4:{q5:'',q6:'',q7:''},s5:{act1:'',pct1:'',act2:'',pct2:'',cross:'',nonneg:''},s6:{salary:'',variable:'',benefits:'',hours:'',tz:'',remote:'',start:'',loc:''},s7:{s2who:'',s2fmt:'',calls:'',turn:'',s4who:'',s5who:'',decision:''},s8:{m1:'',m2:'',m3:'',m4:'',m5:'',n1:'',n2:'',n3:'',n4:'',n5:'',db:''},s9:{p1n:'',p1r:'',p1w:'',p1c:'',p1rx:'',p1note:'',p2n:'',p2r:'',p2w:'',p2c:'',p2rx:'',p2note:'',p3n:'',p3r:'',p3w:'',p3c:'',p3rx:'',p3note:''},s10:{del:'',freq:'',fmt:'',slack:'',urg:'',upd:'',chk:{}}};

const fld=(l,s,k,ph='')=>`<div class="fg"><label>${l}</label><input data-s="${s}" data-k="${k}" value="${(D[s][k]||'').replace(/"/g,'&quot;')}" placeholder="${ph}"></div>`;
const ta=(l,s,k,ph='')=>`<div class="fg"><label>${l}</label><textarea data-s="${s}" data-k="${k}" placeholder="${ph}">${D[s][k]||''}</textarea></div>`;
const qb=(n,q,s,k)=>`<div class="qblock"><div class="qnum">Q${n}</div><div class="qtext">${q}</div><div class="fg"><textarea data-s="${s}" data-k="${k}" placeholder="Notes...">${D[s][k]||''}</textarea></div></div>`;

const secs=[
()=>`<div class="sec-tag">Section 01</div><div class="sec-title">Call details</div><div class="sec-sub">Fill this out before the call starts. This becomes your session record.</div>
<div class="g2">${fld('Client name','s1','clientName','e.g. SpendHound')}${fld('Role being hired','s1','role','e.g. Senior AE')}</div>
<div class="g2">${fld('Date & time','s1','datetime','e.g. May 21, 2:00 PM ET')}${fld('Talent partner','s1','tp','e.g. Rebeca Pareja')}</div>
<div class="g2">${fld('Client contacts on call','s1','contacts','Names + titles')}${fld('Account lead','s1','acctLead','LatamCent lead')}</div>
<div class="g2">${fld('Replacement or new role?','s1','type','Replacement / New')}${fld('Grain recording URL','s1','grain','Paste after call')}</div>`,

()=>{const items=S2.map((t,i)=>`<label class="chkitem${D.s2.chk[i]?' on':''}" data-ci="s2" data-idx="${i}"><input type="checkbox" ${D.s2.chk[i]?'checked':''}><span>${t}</span></label>`).join('');
return `<div class="sec-tag">Section 02 · Required</div><div class="sec-title">Pre-call prep</div><div class="sec-sub">Do not go into a kickoff cold. Check every item before joining.</div>
<div class="callout callout-warn">⚠ Skipping prep is the fastest way to lose client confidence. A talent partner who already knows the company, product, and comp range signals expertise from minute one.</div>
<div class="chklist">${items}</div>`;},

()=>`<div class="sec-tag">Section 03 · Required</div><div class="sec-title">Current state discovery</div><div class="sec-sub">Understanding what is broken today is the foundation of the search. Do not rush this section.</div>
${qb(1,'Walk me through the team structure — headcount, leads, who reports to whom.','s3','q1')}
${qb(2,"If this is a replacement — what specifically didn't work? Skill, attitude, or culture?",'s3','q2')}
${qb(3,'What tools, systems, or processes does the team rely on day-to-day?','s3','q3')}
${qb(4,'Have you already interviewed candidates? What was the pattern in why they didn\'t move forward?','s3','q4')}`,

()=>`<div class="sec-tag">Section 04 · Required</div><div class="sec-title">Defining success</div><div class="sec-sub">Get specific. Vague success criteria equals the wrong hire.</div>
<div class="callout callout-info">💡 The "what would cause failure" question is just as important. It surfaces landmines — team dynamics, pace, unspoken expectations.</div>
${qb(5,'What does success look like at 30 days?','s4','q5')}
${qb(6,'What does success look like at 90 days?','s4','q6')}
${qb(7,'What would cause this person to fail in the first 3 months?','s4','q7')}`,

()=>`<div class="sec-tag">Section 05</div><div class="sec-title">Role & scope specifics</div><div class="sec-sub">Understand the day-to-day before writing the sourcing brief.</div>
<div class="g2">${fld('Primary activity','s5','act1','e.g. Live call coaching')}${fld('% time','s5','pct1','e.g. 40%')}</div>
<div class="g2">${fld('Secondary activity','s5','act2','e.g. Reporting & strategy')}${fld('% time','s5','pct2','e.g. 30%')}</div>
<div class="g1">${ta('Cross-functional partners','s5','cross','Ops, Marketing, L&D, Product?')}</div>
<div class="g1">${ta('Non-negotiable vs. nice-to-have','s5','nonneg','What in the JD is truly required vs. trainable?')}</div>`,

()=>`<div class="sec-tag">Section 06 · Lock this in</div><div class="sec-title">Compensation & logistics</div><div class="sec-sub">Must be completed before profiles are presented. No exceptions.</div>
<div class="callout callout-lock">🔒 Do not present profiles until comp is confirmed on this call. Lock the number now.</div>
<div class="g2">${fld('Salary range','s6','salary','e.g. $3,500–$4,500/mo')}${fld('Variable / bonus','s6','variable','e.g. 20% variable')}</div>
<div class="g2">${fld('Benefits (LATAM)','s6','benefits','e.g. Health, equity')}${fld('Working hours','s6','hours','e.g. 9–6 ET')}</div>
<div class="g2">${fld('Time zone','s6','tz','e.g. ET preferred')}${fld('Remote / office','s6','remote','e.g. Fully remote')}</div>
<div class="g2">${fld('Target start date','s6','start','e.g. ASAP / July 1')}${fld('Location preference','s6','loc','e.g. Colombia, Mexico')}</div>`,

()=>`<div class="sec-tag">Section 07 · Required</div><div class="sec-title">Interview process design</div><div class="sec-sub">Define every stage before sourcing starts.</div>
<div class="stage"><div class="stage-title">1 · LatamCent screening — 30 min</div><div class="stage-sub">Topgrading + scenario questions. Recording shared with client same day.</div></div>
<div class="stage"><div class="stage-title">2 · Client first interview — 30 min</div><div class="g2" style="margin-top:10px;margin-bottom:0">${fld('Who leads this?','s7','s2who','Name + title')}${fld('Format','s7','s2fmt','Zoom, async, etc.')}</div></div>
<div class="stage"><div class="stage-title">3 · Take-home assessment</div><div class="stage-sub">Dashboard diagnosis · coaching scenario · framework design.</div><div class="g2" style="margin-bottom:0">${fld('Real calls provided?','s7','calls','Yes / No / TBD')}${fld('Turnaround expected','s7','turn','e.g. 48 hrs')}</div></div>
<div class="stage"><div class="stage-title">4 · Live assessment review + role play</div><div class="stage-sub">Candidate presents work. Live Q&A or role play with hiring manager.</div><div class="g1" style="margin-bottom:0">${fld('Who runs this?','s7','s4who','Name + title')}</div></div>
<div class="stage"><div class="stage-title">5 · Final culture & values interview</div><div class="g2" style="margin-top:10px;margin-bottom:0">${fld('Who runs this?','s7','s5who','CEO / President / People')}${fld('Decision turnaround','s7','decision','e.g. 24 hrs after')}</div></div>`,

()=>`<div class="sec-tag">Section 08</div><div class="sec-title">Ideal candidate profile (ICP)</div><div class="sec-sub">Align on must-haves vs. nice-to-haves before sourcing begins.</div>
<div class="icp-cols">
<div class="icp-col"><div class="icp-hdr icp-must">Must-have / Non-negotiable</div>${[1,2,3,4,5].map(i=>`<div class="fg" style="padding:8px 12px"><input data-s="s8" data-k="m${i}" value="${(D.s8['m'+i]||'').replace(/"/g,'&quot;')}" placeholder="Requirement ${i}"></div>`).join('')}</div>
<div class="icp-col"><div class="icp-hdr icp-nice">Nice to have</div>${[1,2,3,4,5].map(i=>`<div class="fg" style="padding:8px 12px"><input data-s="s8" data-k="n${i}" value="${(D.s8['n'+i]||'').replace(/"/g,'&quot;')}" placeholder="Preference ${i}"></div>`).join('')}</div>
</div>
<div class="g1">${ta('Deal-breakers / disqualifiers (Q11)','s8','db','English level minimum, auto-no list...')}</div>`,

()=>{const pc=n=>{const rx=D.s9[`p${n}rx`]||'';
const btns=[['Strong yes','syes'],['Yes','yes'],['Maybe','maybe'],['No','no']].map(([l,c])=>`<button class="rx-btn${rx===l?' '+c:''}" data-pn="${n}" data-r="${l}">${l}</button>`).join('');
return `<div class="pcard"><div class="pcard-hdr">Profile ${n}</div><div class="pcard-body">
<div class="g2">${fld('Name / LinkedIn','s9',`p${n}n`,'Full name or LinkedIn URL')}${fld('Current role & company','s9',`p${n}r`,'')}</div>
<div class="g2">${fld('Why relevant','s9',`p${n}w`,'')}${fld('Potential concern','s9',`p${n}c`,'')}</div>
<div class="fg"><label>Client reaction</label><div class="rx-row">${btns}</div></div>
<div class="fg"><label>Notes</label><input data-s="s9" data-k="p${n}note" value="${(D.s9[`p${n}note`]||'').replace(/"/g,'&quot;')}" placeholder="What resonated or didn't?"></div>
</div></div>`;};
return `<div class="sec-tag">Section 09</div><div class="sec-title">Sample profile review</div><div class="sec-sub">Present 2–3 profiles to calibrate direction. Ask for a gut reaction on each.</div>${pc(1)}${pc(2)}${pc(3)}`;},

()=>{const items=S10.map((t,i)=>`<label class="chkitem${D.s10.chk[i]?' on':''}" data-ci="s10" data-idx="${i}"><input type="checkbox" ${D.s10.chk[i]?'checked':''}><span>${t}</span></label>`).join('');
return `<div class="sec-tag">Section 10</div><div class="sec-title">Cadence & close</div><div class="sec-sub">End every call with clear commitments. Vague next steps kill momentum.</div>
<div class="g2">${fld('Profile delivery date','s10','del','Commit to a specific date')}${fld('Update frequency','s10','freq','e.g. Every Wednesday via Slack')}</div>
<div class="g2">${fld('Feedback format','s10','fmt','Notion, Slack, email?')}${fld('Key Slack channel','s10','slack','#channel-name')}</div>
<div class="g2">${fld('Urgent contact','s10','urg','Who to reach if urgent?')}${fld("What we'll update them on",'s10','upd','# sourced, reached out, replied, rejected')}</div>
<div style="margin-top:20px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin-bottom:10px">Post-call checklist</div>
<div class="chklist">${items}</div>`;},
];

const titles=['Call details','Pre-call prep','Current state','Defining success','Role & scope','Comp & logistics','Interview process','ICP','Sample profiles','Cadence & close'];

function render(){
  const el=document.getElementById('main');
  const nav=`<div class="navrow">
    <button class="btn" id="bP" ${cur===0?'disabled':''}>← Previous</button>
    <span class="navrow-center">${titles[cur]}</span>
    ${cur<9?`<button class="btn btn-green" id="bN">Next →</button>`:`<button class="btn btn-done" id="bD">Done — Generate PDF ✓</button>`}
  </div>`;
  el.innerHTML=secs[cur]()+nav;
  document.getElementById('pLbl').textContent=`Section ${cur+1} of 10`;
  document.getElementById('pFill').style.width=`${(cur+1)*10}%`;
  window.scrollTo({top:0,behavior:'smooth'});
  bind();
}

function bind(){
  document.querySelectorAll('[data-s]').forEach(el=>{
    el.addEventListener('input',e=>{D[e.target.dataset.s][e.target.dataset.k]=e.target.value;});
  });
  document.querySelectorAll('[data-ci]').forEach(lbl=>{
    lbl.querySelector('input').addEventListener('change',e=>{
      const s=lbl.dataset.ci,i=+lbl.dataset.idx;
      D[s].chk[i]=e.target.checked;
      lbl.classList.toggle('on',e.target.checked);
    });
  });
  document.querySelectorAll('.rx-btn').forEach(b=>{
    b.addEventListener('click',e=>{
      const n=e.target.dataset.pn,r=e.target.dataset.r;
      D.s9[`p${n}rx`]=r;
      const m={'Strong yes':'syes','Yes':'yes','Maybe':'maybe','No':'no'};
      document.querySelectorAll(`.rx-btn[data-pn="${n}"]`).forEach(x=>{x.className=`rx-btn${x.dataset.r===r?' '+m[r]:''}`;});
    });
  });
  document.getElementById('bP')?.addEventListener('click',()=>{cur--;render();});
  document.getElementById('bN')?.addEventListener('click',()=>{cur++;render();});
  document.getElementById('bD')?.addEventListener('click',pdf);
}

function pdf(){
  const btn=document.getElementById('bD');
  btn.textContent='Generating...';btn.disabled=true;
  setTimeout(()=>{try{buildPDF();}catch(e){alert('PDF error: '+e.message);}btn.textContent='Done — Generate PDF ✓';btn.disabled=false;},50);
}

function buildPDF(){
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,M=16,CW=W-M*2;
  const TEAL=[15,110,86],TEAL_MID=[29,158,117],TEAL_LT=[225,245,238];
  const DARK=[26,26,26],GRAY=[100,100,100],LGRAY=[210,210,205],WHITE=[255,255,255];
  let y=28;
  function chkY(n=20){if(y+n>274){doc.addPage();y=28;drawPageHeader();}}
  function drawPageHeader(){doc.setFillColor(...TEAL);doc.rect(0,0,W,22,'F');doc.setTextColor(...WHITE);doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.text('LATAMCENT  ·  KICKOFF CALL RECORD',M,9);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(168,221,208);doc.text(`${D.s1.clientName||'—'}  ·  ${D.s1.role||'—'}  ·  ${D.s1.datetime||new Date().toLocaleDateString()}`,M,15.5);}
  function hdr(t,badge){chkY(12);doc.setFillColor(...TEAL);doc.rect(M,y,CW,8,'F');doc.setTextColor(...WHITE);doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text(t.toUpperCase(),M+4,y+5.5);if(badge){doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(168,221,208);doc.text(badge,M+CW-4,y+5.5,{align:'right'});}y+=11;}
  function kv2(l1,v1,l2,v2){chkY(12);const hw=CW/2-3;function one(l,v,x){if(!v)return;doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(...GRAY);doc.text(l.toUpperCase(),x,y);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...DARK);doc.text(doc.splitTextToSize(v,hw),x,y+4);}const n1=v1?doc.splitTextToSize(v1,hw).length:0;const n2=v2?doc.splitTextToSize(v2||'',hw).length:0;one(l1,v1,M);if(l2)one(l2,v2,M+CW/2+2);y+=Math.max(n1,n2)*4.5+8;}
